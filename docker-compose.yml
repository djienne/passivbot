services:
  passivbot-hype-live:
    build:
      context: .
      dockerfile: Dockerfile_live
    image: passivbot:latest
    container_name: passivbot-hype-live
    restart: unless-stopped
    stop_grace_period: 30s
    # Outbound-only bot: reuse the default bridge instead of allocating a new
    # /24 (this host's Docker address pool is already fully subnetted).
    network_mode: bridge
    # The default bridge hands the container Docker Desktop's VM resolver as its
    # only nameserver; ccxt resolves via aiodns (c-ares), which has no fallback
    # and raises ExchangeNotAvailable the moment that one server stalls. Give it
    # public resolvers and a short timeout so a stall costs 2s, not a cycle.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    dns_opt:
      - timeout:2
      - attempts:3
    environment:
      # Unbuffered stdout so `docker logs -f` streams in real time
      PYTHONUNBUFFERED: "1"
      SKIP_RUST_COMPILE: "true"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 1500M
    volumes:
      - ./:/app/
      - ./api-keys.json:/app/api-keys.json
    working_dir: /app
    # Default command runs src/main.py with config_hype.json
    command: python src/main.py configs/config_hype.json
    #command: python src/backtest.py configs/examples/top20mcap.json
    #command: python src/optimize.py configs/template.json

